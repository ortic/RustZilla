name: Release

# Builds the packages of every platform and leaves them in a draft GitHub
# release when a version tag is pushed (see CLAUDE.md for the notes).
#
#   git tag -a v0.1.0 -m "RustZilla 0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - name: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            formats: deb
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: wix,nsis
          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: nsis
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            formats: app,dmg
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform.target }}

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # AppImage tooling runs through FUSE on the runner.
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      # ring builds its aarch64 assembly for MSVC with clang.
      - name: Windows ARM64 packaging dependencies
        if: matrix.platform.target == 'aarch64-pc-windows-msvc'
        shell: bash
        run: |
          if ! command -v clang >/dev/null; then
            choco install llvm -y --no-progress
            echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
          fi

      - name: Build packages
        shell: bash
        run: |
          cargo packager --release -p rustzilla-app \
            --target ${{ matrix.platform.target }} \
            --formats ${{ matrix.platform.formats }} \
            --out-dir "${{ github.workspace }}/dist"

      # cargo-packager names the .dmg after the product (RustZilla_0.1.0_x64.dmg),
      # the others after the binary (rustzilla_0.1.0_amd64.deb).
      - name: Name the disk image as the other packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          cd dist
          for f in RustZilla_*.dmg; do
            mv "$f" "rustzilla${f#RustZilla}"
          done

      # The system in every name: rustzilla_0.1.0_x64-setup.exe ->
      # rustzilla_0.1.0_windows_x64-setup.exe, rustzilla_0.1.0_amd64.deb ->
      # rustzilla_0.1.0_linux_amd64.deb, rustzilla_0.1.0_x64.dmg ->
      # rustzilla_0.1.0_macos_x64.dmg. The archives have it already.
      - name: Name the packages with their system
        shell: bash
        run: |
          shopt -s nullglob
          case "${{ runner.os }}" in
            Linux) os=linux ;;
            Windows) os=windows ;;
            macOS) os=macos ;;
          esac
          cd dist
          for f in rustzilla_*; do
            new=$(echo "$f" | sed -E "s/^rustzilla_([^_]+)_/rustzilla_\1_${os}_/")
            mv "$f" "$new"
          done
          ls

      - name: Plain binary archive
        shell: bash
        run: |
          bin=rustzilla
          [ "${{ runner.os }}" = "Windows" ] && bin=rustzilla.exe
          mkdir -p dist/archive
          # beforePackagingCommand builds for the runner's own target.
          cp "target/release/$bin" README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE dist/archive/
          cd dist/archive
          name="rustzilla-${GITHUB_REF_NAME//\//-}-${{ matrix.platform.name }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" .
          else
            tar czf "../$name.tar.gz" .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rustzilla-${{ matrix.platform.name }}
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.msi
            dist/*-setup.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
